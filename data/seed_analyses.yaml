      long: "달러 기축 약화는 점진적이지만 추세적. 금·원자재·중국 외 신흥국 통화 비중 확대."
    asset_recommendations: |
      장기 명목채권 비중 축소, 금/원자재 비중 확대, 미·중·인도 등 다극화 노출, 다양한 통화·자산 분산.
