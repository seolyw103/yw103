      장기 부채 사이클의 후반부에 진입했다. 미국 재정적자와 부채 발행이 명목금리를 누르기 위한 재정·통화
      혼합 정책을 강제할 것이며, 결과적으로 명목채권의 실질가치는 훼손된다. 분산된 포트폴리오와 실물자산 비중을 권한다.
