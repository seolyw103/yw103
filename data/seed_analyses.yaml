  - title: "FOMC 점도표·기자회견 — 데이터 의존적 신중한 인하 경로"
    speaker: "Jerome Powell"
    speaker_type: "공식기관"
    region: "US"
    published_at: "2026-03-19"
    format: "Speech"
    url: "https://www.federalreserve.gov/newsevents/pressconferences.htm"
    asset_classes: ["주식", "채권", "외환"]
    time_horizons: ["단기", "중기"]
    overall_outlook: "중립"
    macro_conditions:
      - "인플레이션 둔화"
      - "고용 견조"
      - "연착륙"
    key_thesis: |
      디스인플레이션은 진행 중이지만 마지막 1마일은 험난하다. 노동시장이 견조한 한 서두를 이유가 없으며,
      금리 인하는 데이터 의존적으로 단계적으로 진행할 것. 인하 폭과 시기에 대한 사전 약속은 하지 않는다.
    time_period_view:
      short: "다음 회의는 동결 가능성을 열어두며, 인플레 재가속 시 인하 보류."
      mid: "근원 PCE가 2%대로 안정되면 점진적 인하 — 연 2회 수준."
      long: "장기 중립금리는 과거보다 다소 높을 수 있다."
    asset_recommendations: ""
    confidence: "중간"
    scenarios:
      - name: "인플레 재가속 → 인하 보류"
        triggers: ["근원 CPI", "임금 상승률"]
        horizon: ["단기"]
