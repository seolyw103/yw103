[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yw103"
version = "0.1.0"
description = "Collect global authoritative economic market analyses and organize them into Notion."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.40.0",
    "notion-client>=2.2.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0.1",
    "yt-dlp>=2024.8.6",
    "youtube-transcript-api>=0.6.2",
    "feedparser>=6.0.11",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "readability-lxml>=0.8.1",
    "lxml[html_clean]>=5.2.0",
    "pyyaml>=6.0.1",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
yw103-setup = "scripts.setup_notion:main"
yw103-add = "scripts.add:main"
yw103-seed = "scripts.seed:main"
yw103-ingest = "scripts.ingest:main"
yw103-poll = "scripts.poll_feeds:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
